schema: spec-driven

context: |
  Language: Portuguese. Write artifact prose in Portuguese; keep OpenSpec
  structural headings (Requirement, Scenario, ADDED/MODIFIED/REMOVED Requirements)
  and SHALL/MUST/WHEN/THEN keywords in English.
  LeafCare is an Android app for visual triage of tobacco leaves, not a definitive
  agronomic diagnosis. Kotlin/Compose, CameraX, Room, WorkManager, JDK 17,
  Android SDK 35, Gradle wrapper 8.9; Python 3.12 for the ML pipeline.
  Inference runs on device. After the first authenticated access, camera,
  gallery, classification and local history remain available offline.
  Supabase provides Auth, Postgrest and private photo Storage, not inference.
  Room is observed by the UI; save locally before syncing. UUIDs, retry,
  tombstones and account isolation preserve data through network failures.
  Current model: MobileNetV4 Small distilled, one float32 TFLite, schema 2.
  Input RGB 0-255 NHWC; bicubic shorter-side 256 then center crop 224.
  Embedded ImageNet normalization, softmax and temperature scaling.
  16 classes, RGB [1,224,224,3], calibrated threshold in model_metadata.json.
  Keep model weights, training recipe, dataset, class order, threshold and
  Supabase schema unchanged unless the user explicitly requests those changes.
  Read AGENTS.md, README.md, docs/AI_CONTEXT.md and docs/DEVELOPMENT.md first.
  Code, tests, migrations and model artifacts are the source of truth; specs
  describe supported contracts and do not certify pending device validation.
  ML guide: machine-learning/README.md. Current reports: docs/model-reports/mobilenetv4-distilled/. Ensemble reports are historical.
  Keep benchmark_artifacts intact unless a later request changes that scope.
  Follow the user's existing authorization for Git actions and changes.
  Never include credentials, local.properties, .env or signing keys in artifacts.

rules:
  proposal:
    - Explain the concrete problem, affected capabilities and user-visible outcome.
    - Keep scope small; identify offline, Auth, sync or model-contract impact when relevant.
    - Pure documentation and routine fixes can proceed directly without a new change.
  specs:
    - Use testable requirements with SHALL or MUST and at least one WHEN/THEN scenario each.
    - Reuse existing capability paths; describe observable contracts, not incidental code layout.
    - Separate existing behavior from proposed behavior and device checks still pending.
  design:
    - Reuse existing patterns and describe migration or rollback only when applicable.
    - File moves must account for imports, readers, generated outputs and documentation links.
  tasks:
    - Use small verifiable checkboxes; mark complete only after work actually finishes.
    - Include proportional tests and a debug APK; record cached checks and unexecuted device QA accurately.

operations:
  apply:
    guidance:
      - Preserve unrelated work; run the smallest relevant checks before expanding validation.
      - Generate the debug APK using bash ./gradlew assembleDebug on Linux or gradlew.bat on Windows.
      - Commit and publish only within the authorization already given by the user.
  archive:
    guidance:
      - Archive only completed work after reviewing the delta specs and validation evidence.
      - Sync completed contract changes into specs and report remaining limitations concisely.
