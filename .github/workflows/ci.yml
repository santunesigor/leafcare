name: CI

on:
  push:
    branches: [main, refactor/**, experiment/**]
  pull_request:
    branches: [main]

jobs:
  openspec-validation:
    name: OpenSpec Validation
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.14.1
      - name: Validate specs and active changes
        run: openspec validate --all --strict --no-interactive
      - name: Validate archived tasks
        run: openspec validate --archived --strict --no-interactive

  python-tests:
    name: Python Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine-learning/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Validate bundle (with model)
        run: python validate_bundle.py --require-model

  android-tests:
    name: Android Unit Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Supabase key for Android CI
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ ! "$SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]]; then
            echo "SUPABASE_PUBLISHABLE_KEY must be configured as a publishable key in GitHub Actions."
            exit 1
          fi

          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/tests/testDebugUnitTest/
            android-app/app/build/reports/screenshots/
          if-no-files-found: warn

      - name: Verify model assets
        run: ./gradlew verifyModelAssets --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leafcare-debug-apk
          path: android-app/app/build/outputs/apk/distribution/debug/leafcare-*.apk
          if-no-files-found: error

  # Instrumented tests require a device/emulator; run locally via docs/TESTING.md
  # connectedDebugAndroidTest is not run in CI
