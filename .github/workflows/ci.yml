name: CI

on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine-learning/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Validate bundle (with model)
        run: python validate_bundle.py --require-model

  android-tests:
    name: Android Unit Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify model assets
        run: ./gradlew verifyModelAssets --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

  # Instrumented tests require a device/emulator; run locally via MANUAL_TESTS.md
  # connectedDebugAndroidTest is not run in CI