# Política do ciclo de retreino, lida por training/ (a receita de treino fica em training/train.py).
# Mudar seed ou field_split move pessoas entre os splits de campo: mantenha os valores entre ciclos.
seed: 42
field_split:            # fotos de campo, sorteio determinístico por grupo de pessoa
  train: 0.70
  validation: 0.15
  field_test: 0.15
min_field_groups: 5     # abaixo disso, todas as fotos de campo vão para o treino (sem field_test)
near_duplicate_hamming: 4
min_image_side: 128
expiring_soon_days: 14  # janela do aviso de cópias v1.4 perto de vencer em `status`
max_tla_macro_f1_drop: 0.02
